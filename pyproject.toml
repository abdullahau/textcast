[project]
name = "textcast"
version = "0.2.2"
description = "Turn newsletters and articles into a private, self-hosted audio reader"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.5",
    "python-dotenv>=1.2",
    "requests>=2.34",
    "selectolax>=0.4",
]

[project.optional-dependencies]
# The engine. Pulls PyTorch and spaCy, and needs espeak-ng on the system.
kokoro = [
    "kokoro>=0.9",
    # Declared explicitly so [tool.uv.sources] can pin it to the CPU index;
    # a source only binds a direct dependency, and kokoro pulls torch itself.
    "torch>=2.4",
    # Pinned explicitly: kokoro otherwise pip-installs this spaCy model at
    # first synthesis, which needs network and write access to the venv —
    # both wrong inside a container.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
web = [
    "fastapi>=0.141",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52",
]
documents = [
    "pypdf>=6.16",
    "python-docx>=1.2",
]
# Section summaries. The OpenAI client is used as a generic client for any
# endpoint that speaks the protocol, which is all of them now — Gemini,
# OpenRouter, Groq, a local Ollama. One dependency instead of one per vendor.
summaries = [
    "openai>=1.100",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    # Browser tests for the read-along player; run `playwright install chromium`.
    "playwright>=1.62",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Kokoro depends on torch, which defaults to the CUDA build and drags in
# ~4 GB of NVIDIA runtime. This box has no GPU and neither does the container,
# so take torch from PyTorch's CPU index instead.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.metadata]
# The pinned spaCy model wheel is a direct URL reference.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/textcast"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
