[project]
name = "textcast"
version = "0.2.0"
description = "Turn newsletters and articles into a private, self-hosted audio reader"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.5",
    "selectolax>=0.4.11",
]

[project.optional-dependencies]
# The default engine. ONNX Runtime only — no PyTorch, no espeak-ng.
supertonic = ["supertonic>=0.3.0"]
# The alternative engine. Pulls PyTorch and spaCy; needs espeak-ng installed.
kokoro = ["kokoro>=0.9.4"]
web = [
    "fastapi>=0.115",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32",
]
summaries = ["google-genai>=1.0.0"]

[project.scripts]
textcast = "textcast.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13.2",
    # Browser tests for the read-along player; run `playwright install chromium`.
    "playwright>=1.49",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textcast"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
