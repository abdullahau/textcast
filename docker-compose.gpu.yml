# NVIDIA overlay. Layer it over the base file, never on its own:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Builds the image from the `cuda` extra and gives the worker the host's
# devices. Needs the NVIDIA container toolkit. The app service is left alone:
# it serves files and never loads a model.

services:
  app:
    build:
      context: .
      args:
        ACCEL: cuda
      secrets:
        - hf_token
    image: textcast:gpu

  worker:
    build:
      context: .
      args:
        ACCEL: cuda
      secrets:
        - hf_token
    image: textcast:gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
