<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The maskable variant. Android crops a maskable icon to whatever shape
       the launcher wants, and keeps only the middle 80%. icon.svg draws to
       its own rounded edge, so cropped it loses the headband. Here the
       background is full-bleed and the mark is scaled into the safe circle. -->
  <rect width="64" height="64" fill="#141310"/>
  <g transform="translate(32 32) scale(0.66) translate(-32 -32)">
    <g fill="none" stroke="#FAFAFA" stroke-width="4.5" stroke-linecap="round">
      <path d="M14 34v-6a18 18 0 0 1 36 0v6"/>
      <path d="M14 34h6v14h-4a2 2 0 0 1-2-2z"/>
      <path d="M50 34h-6v14h4a2 2 0 0 0 2-2z"/>
    </g>
    <g stroke="#7A7A80" stroke-width="3" stroke-linecap="round">
      <path d="M27 26h10"/><path d="M27 33h10"/><path d="M27 40h6"/>
    </g>
  </g>
</svg>
