# Development, picked up automatically. Mounting the working tree over
# /app/src means an edit on the host is the code the container runs.
#
# Templates and static files reload themselves. Python needs a restart, which
# --reload and watchfiles do.
#
# Leave this out on a server: docker compose -f docker-compose.yml up -d

services:
  app:
    command:
      - uvicorn
      - textcast.web.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --reload
      - --reload-dir
      - /app/src
    volumes:
      - ./src:/app/src

  worker:
    command: ["watchfiles", "--filter", "python", "python -m textcast", "/app/src"]
    volumes:
      - ./src:/app/src
