# textcast, reachable only on your tailnet.
#
# The app never binds a host port. It shares the tailscale container's network
# namespace, so the only way in is your tailnet — nothing is exposed to the
# LAN or the internet, and there is no port to forget to close.

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: textcast-ts
    hostname: textcast
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:textcast
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/serve.json:/config/serve.json:ro
    cap_add:
      - NET_ADMIN

  app:
    build: .
    image: textcast:latest
    container_name: textcast-app
    restart: unless-stopped
    # Everything reaches the app through tailscale, including the worker.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    env_file:
      - .env
    environment:
      # The worker runs as its own service, so the web process only serves.
      TEXTCAST_WORKERS: "0"
    volumes:
      - textcast-data:/data

  worker:
    build: .
    image: textcast:latest
    container_name: textcast-worker
    restart: unless-stopped
    command: ["textcast", "worker"]
    env_file:
      - .env
    volumes:
      - textcast-data:/data
    # Synthesis is CPU-bound; leave a core for the web process.
    cpus: ${TEXTCAST_WORKER_CPUS:-3}

volumes:
  textcast-data:
  tailscale-state:
