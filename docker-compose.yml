# textcast — web and worker, sharing one data directory.
#
# No opinion about how you reach it: put a reverse proxy, a VPN or nothing
# in front. Bind to 127.0.0.1 in .env if something else terminates TLS here.
#
# docker-compose.override.yml sits beside this and is picked up
# automatically. For a server: docker compose -f docker-compose.yml up -d

# Optional, and only used at build time: HF_TOKEN in .env raises the hub's
# anonymous rate limit while the weights are baked in. Nothing fails without
# it — the Kokoro repo is public.
secrets:
  hf_token:
    environment: HF_TOKEN

services:
  app:
    build:
      context: .
      secrets:
        - hf_token
    image: textcast:latest
    container_name: textcast-app
    restart: unless-stopped
    ports:
      - "${TEXTCAST_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # The worker is its own service, so the web process only serves.
      TEXTCAST_WORKERS: "0"
      TEXTCAST_DATA_DIR: /data
    # Must be the owner of ./data: a bind mount carries the host's ownership,
    # and the image's own uid is 10001. Set TEXTCAST_UID/GID in .env.
    user: "${TEXTCAST_UID:-1000}:${TEXTCAST_GID:-1000}"
    volumes:
      # A bind mount, not a named volume: the database, audio, sources and
      # block cache stay in ./data, where your backups already point.
      - ${TEXTCAST_DATA_DIR:-./data}:/data

  worker:
    build:
      context: .
      secrets:
        - hf_token
    image: textcast:latest
    container_name: textcast-worker
    restart: unless-stopped
    command: ["python", "-m", "textcast"]
    env_file:
      - path: .env
        required: false
    environment:
      TEXTCAST_DATA_DIR: /data
    user: "${TEXTCAST_UID:-1000}:${TEXTCAST_GID:-1000}"
    volumes:
      - ${TEXTCAST_DATA_DIR:-./data}:/data
    # The image's healthcheck curls the web port, which the worker does not
    # serve. Left on, it sits "unhealthy" for ever while working perfectly.
    healthcheck:
      disable: true
    # Synthesis is CPU-bound; leave something for the web process.
    cpus: ${TEXTCAST_WORKER_CPUS:-3}
